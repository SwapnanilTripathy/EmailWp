services:
  - type: web
    name: email-to-whatsapp
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_URL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER
        value: me
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_RECIPIENT_NUMBER
        sync: false
      - key: POLL_INTERVAL_MS
        value: 30000
      - key: FILTER_TERMS
        sync: false
